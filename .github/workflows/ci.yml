name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Dieser Workflow liest nur. Standard ist bewusst eng gesetzt,
# der Deploy-Workflow in Demo 9 braucht dann mehr.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck
